#####################################################################
##   Resume Print
#####################################################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME

# variable_zhop: 10
variable_etemp: 0
variable_xy_speed: 200      # mm/s
variable_xy_accel: 7500    # acceleration
variable_z_fast: 30         # mm/s
variable_z_slow: 5          # mm/s
variable_resume_x: 0
variable_resume_y: 0
variable_resume_z: 0
variable_saved_velocity: 0
variable_saved_accel: 0

gcode:
    {% if printer.pause_resume.is_paused %}

        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}

        SET_VELOCITY_LIMIT VELOCITY={xy_speed} ACCEL={xy_accel}     #set speed
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={xy_speed}    # Return to the parked position if the user moved the toolhead

        CLEAN_NOZZLE    # Clean the nozzle
        G4 P250         # Allow any ooze to settle

        G90 # absolute positioning

        G1 X{resume_x} Y{resume_y} F{xy_speed * 60}   # Return above the print while maintaining the raised Z height

        # Lower straight down to the print
        G1 Z{resume_z + 1} F{z_fast * 60}      # gets close quicky
        G1 Z{resume_z} F{z_slow * 60}                 # last 1mm is slow and controlled

        RESTORE_GCODE_STATE NAME=PAUSE MOVE=0   # Restore parser state only (no movement)

        SET_VELOCITY_LIMIT VELOCITY={saved_velocity} ACCEL={saved_accel}    # restore speeds

        BASE_RESUME

    {% endif %}

